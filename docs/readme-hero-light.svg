<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">OmniCodeSpace: every coding agent, on one track</title>
<desc id="d">Claude Code, Codex, cloud agents and you each run on a line into OmniCodeSpace on your machine, which reads and writes your git repos, the agents' session logs and TODO.md.</desc>
<style>
svg { --mono: "Overpass Mono", ui-monospace, Consolas, monospace; font-family: Overpass, "Segoe UI", system-ui, sans-serif; }
text { fill: #16231d; }
.sub { fill: #4e5e56; font-size: 11.5px; } .name { font-size: 13.5px; font-weight: 600; }
.tile { fill: #e6ebe4; stroke: #c9d2c9; stroke-width: 1.5; } .hubtile { fill: #f3f5f0; stroke: #16231d; stroke-width: 2; }
.ring { fill: none; stroke: #2346c4; stroke-opacity: 0.22; stroke-width: 1.5; } .halo { fill: #2346c4; fill-opacity: 0.07; }
.track { fill: none; stroke-width: 4; stroke-linecap: round; } .stn { fill: #f3f5f0; stroke-width: 3; }
.ico { fill: none; stroke: #16231d; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.c-claude { stroke: #c25a1c; } .c-codex { stroke: #0e7c86; } .c-cloud { stroke: #2346c4; } .c-you { stroke: #8a2a7e; } .c-git { stroke: #1f8a55; } .c-ink { stroke: #4e5e56; }
.f-claude { fill: #c25a1c; } .f-codex { fill: #0e7c86; } .f-cloud { fill: #2346c4; } .f-you { fill: #8a2a7e; } .f-git { fill: #1f8a55; } .f-ink { fill: #4e5e56; }
@media (prefers-reduced-motion: reduce) { .trains { display: none; } }
</style>
<defs><pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="rgb(22 35 29 / 0.05)"/></pattern></defs>
<rect width="1200" height="560" rx="18" fill="#f3f5f0"/>
<rect width="1200" height="560" rx="18" fill="url(#grid)" stroke="#c9d2c9"/>
<g transform="translate(56 150)">
  <rect width="250" height="30" rx="15" fill="#e6ebe4" stroke="#c9d2c9"/>
  <text x="16" y="20" style="font-family:var(--mono);font-size:12.5px;fill:#e0a100;font-weight:600">Early</text>
  <path d="M68 9V21" stroke="#c9d2c9"/>
  <text x="80" y="20" style="font-family:var(--mono);font-size:12.5px;fill:#4e5e56">Local · Node 24 + git</text>
  <text y="112" style="font-weight:900;font-size:62px;letter-spacing:-0.02em">Every coding agent,</text>
  <text y="182" style="font-weight:900;font-size:62px;letter-spacing:-0.02em;fill:#2346c4">on one track.</text>
  <text y="236" style="font-size:18px;fill:#4e5e56">Claude Code, Codex and you, with git as the shared memory.</text>
</g>
<svg x="610" y="20" width="560" height="520" viewBox="0 0 640 520">
      

      <!-- Lines into the hub -->
      <path id="t1" class="track c-claude" d="M80 142 C80 205 296 195 296 252"/>
      <path id="t2" class="track c-codex"  d="M240 142 C240 200 312 200 312 252"/>
      <path id="t3" class="track c-cloud"  d="M400 142 C400 200 328 200 328 252"/>
      <path id="t4" class="track c-you"    d="M560 142 C560 205 344 195 344 252"/>
      <!-- Lines out to what it reads and writes -->
      <path id="b1" class="track c-git" d="M304 404 C304 440 150 430 150 462"/>
      <path id="b2" class="track c-ink" d="M320 404 V462"/>
      <path id="b3" class="track c-git" d="M336 404 C336 440 490 430 490 462"/>

      <circle class="stn c-claude" cx="188" cy="199" r="5"/>
      <circle class="stn c-codex"  cx="276" cy="199" r="5"/>
      <circle class="stn c-cloud"  cx="364" cy="199" r="5"/>
      <circle class="stn c-you"    cx="452" cy="199" r="5"/>
      <circle class="stn c-git" cx="227" cy="434" r="5"/>
      <circle class="stn c-ink" cx="320" cy="433" r="5"/>
      <circle class="stn c-git" cx="413" cy="434" r="5"/>

      <!-- Trains: removed when the viewer prefers reduced motion -->
      <g class="trains">
        <circle r="4" class="f-claude"><animateMotion dur="3.4s" repeatCount="indefinite"><mpath href="#t1"/></animateMotion></circle>
        <circle r="4" class="f-codex"><animateMotion dur="3.4s" begin="0.8s" repeatCount="indefinite"><mpath href="#t2"/></animateMotion></circle>
        <circle r="4" class="f-cloud"><animateMotion dur="3.4s" begin="1.6s" repeatCount="indefinite"><mpath href="#t3"/></animateMotion></circle>
        <circle r="4" class="f-you"><animateMotion dur="3.4s" begin="2.4s" repeatCount="indefinite"><mpath href="#t4"/></animateMotion></circle>
        <circle r="4" class="f-git"><animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#b1"/></animateMotion></circle>
        <circle r="4" class="f-ink"><animateMotion dur="5s" begin="1.2s" repeatCount="indefinite"><mpath href="#b2"/></animateMotion></circle>
        <circle r="4" class="f-git"><animateMotion dur="5s" begin="2.5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;0.5;1" calcMode="linear"><mpath href="#b3"/></animateMotion></circle>
      </g>

      <!-- Top: who works on your projects -->
      <g transform="translate(80 0)">
        <rect class="tile" x="-34" y="24" width="68" height="68" rx="14"/>
        <g class="ico c-claude" transform="translate(0 58)"><path d="M0 -13V13M-13 0H13M-9.2 -9.2L9.2 9.2M-9.2 9.2L9.2 -9.2" stroke-width="3"/></g>
        <text class="name" y="114" text-anchor="middle">Claude Code</text>
        <text class="sub" y="131" text-anchor="middle">brief at session start</text>
      </g>
      <g transform="translate(240 0)">
        <rect class="tile" x="-34" y="24" width="68" height="68" rx="14"/>
        <g class="ico c-codex" transform="translate(0 58)" stroke-width="2.6"><path d="M-11 -7L-3 0L-11 7M1 9H12"/></g>
        <text class="name" y="114" text-anchor="middle">Codex</text>
        <text class="sub" y="131" text-anchor="middle">sandboxed, own branch</text>
      </g>
      <g transform="translate(400 0)">
        <rect class="tile" x="-34" y="24" width="68" height="68" rx="14"/>
        <g class="ico c-cloud" transform="translate(0 58)" stroke-width="2.4"><path d="M-9 8H9A7 7 0 0 0 8 -6A10 10 0 0 0 -11 -3A6 6 0 0 0 -9 8Z"/></g>
        <text class="name" y="114" text-anchor="middle">Cloud agents</text>
        <text class="sub" y="131" text-anchor="middle">orders as git branches</text>
      </g>
      <g transform="translate(560 0)">
        <rect class="tile" x="-34" y="24" width="68" height="68" rx="14" stroke-dasharray="5 4"/>
        <g class="ico c-you" transform="translate(0 58)" stroke-width="2.4"><circle cx="0" cy="-5" r="5.5"/><path d="M-11 12A11 9 0 0 1 11 12"/></g>
        <text class="name" y="114" text-anchor="middle">You</text>
        <text class="sub" y="131" text-anchor="middle">click to allow a push</text>
      </g>

      <!-- Hub -->
      <circle class="halo" cx="320" cy="300" r="82"/>
      <circle class="ring" cx="320" cy="300" r="82"/>
      <rect class="hubtile" x="272" y="252" width="96" height="96" rx="20"/>
      <g transform="translate(320 300)">
        <path class="track c-claude" stroke-width="5" d="M-20 -24 C-20 -4 0 -6 0 18"/>
        <path class="track c-cloud"  stroke-width="5" d="M20 -24 C20 -4 0 -6 0 18"/>
        <path class="track c-codex"  stroke-width="5" d="M0 -24 V18"/>
        <circle class="stn c-git" cx="0" cy="22" r="7" stroke-width="3.5"/>
      </g>
      <text x="320" y="374" text-anchor="middle" style="font-weight:800;font-size:15px">OmniCodeSpace</text>
      <text class="sub" x="320" y="392" text-anchor="middle">On your machine</text>

      <!-- Bottom: what it reads and writes -->
      <g transform="translate(150 0)">
        <rect class="tile" x="-78" y="462" width="156" height="42" rx="10"/>
        <g class="ico" transform="translate(-50 483)" stroke-width="1.8"><circle cx="-3" cy="-6" r="2.5"/><circle cx="-3" cy="7" r="2.5"/><circle cx="6" cy="-2" r="2.5"/><path d="M-3 -3.5V4.5M6 0.5C6 4 -3 2 -3 4.5"/></g>
        <text x="-34" y="488" style="font-size:13.5px">Your git repos</text>
      </g>
      <g transform="translate(320 0)">
        <rect class="tile" x="-78" y="462" width="156" height="42" rx="10"/>
        <g class="ico" transform="translate(-52 483)" stroke-width="1.8"><path d="M-7 -6H7M-7 0H7M-7 6H3"/></g>
        <text x="-36" y="488" style="font-size:13.5px">Session logs</text>
      </g>
      <g transform="translate(490 0)">
        <rect class="tile" x="-78" y="462" width="156" height="42" rx="10"/>
        <g class="ico" transform="translate(-44 483)" stroke-width="1.8"><rect x="-7" y="-7" width="14" height="14" rx="2.5"/><path d="M-3.5 0L-1 3L4 -3"/></g>
        <text x="-28" y="488" style="font-family:var(--mono);font-size:13px">TODO.md</text>
      </g>
    </svg>
</svg>
